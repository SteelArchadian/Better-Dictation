<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .pill { --lvl: 0; --b: #29b6e8; --glow: 60, 170, 235; --ringc: 120, 210, 255; position: relative; width: 48px; height: 48px;
    opacity: 0; transform: scale(0); transition: opacity .5s ease .1s, transform .55s cubic-bezier(.45, 0, .6, 1); }
  .pill.away { --b: #8cc63f; --glow: 150, 200, 50; --ringc: 190, 225, 90; }
  .pill.on { opacity: 1; transform: none; transition: opacity .3s ease, transform .6s cubic-bezier(.2, 1.1, .4, 1); }
  /* Everything is centred on the pill's middle with inset + auto margins, so the dot and the voice disc share one centre. */
  .wave, .dot { position: absolute; left: 50%; top: 50%; border-radius: 50%; }
  /* Three discs on the one centre, each following the voice at its own pace and swell, so they trade places. */
  .wave { width: 100px; height: 100px; background: rgba(var(--glow), calc(0.07 + var(--l) * 0.2));
    border: 1.5px solid rgba(var(--ringc), calc(0.12 + var(--l) * 0.6));
    transform: translate(-50%, -50%) scale(var(--s)); transition: background .3s ease, border-color .3s ease; }
  .dot { width: 36px; height: 36px; transform: translate(-50%, -50%); background: var(--b); transition: background .3s ease; box-shadow: 0 0 6px rgba(0, 0, 0, .35);
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .words { max-width: 32px; font-size: 8px; line-height: 9px; text-align: center; color: rgba(255, 255, 255, .55);
    overflow: hidden; word-break: break-all; max-height: 18px; transition: opacity .2s; }
</style>
</head>
<body>
  <div class="pill" id="pill"><div class="wave" id="w1"></div><div class="wave" id="w2"></div><div class="wave" id="w3"></div><div class="dot"><span class="words" id="words"></span></div></div>
<script>
  const pill = document.getElementById('pill');
  const { listen } = window.__TAURI__.event;
  let target = 0, shown = 0, on = false;

  listen('mic-level', e => { target = e.payload; });
  listen('away', e => pill.classList.toggle('away', e.payload));
  listen('listening', e => {
    on = e.payload;
    pill.classList.toggle('on', on);
    if (on) { target = shown = 0; rings.forEach(r => r.v = 0); requestAnimationFrame(frame); } else words.textContent = '';
  });

  // Rise fast, fall slowly, so the glow follows speech without flicker. Idle while hidden.
  // Each disc has its own pace and wobble, so one swells while another settles.
  const rings = [
    { el: document.getElementById('w1'), rise: 0.5, fall: 0.12, wob: 0.0, hz: 0, base: 0.35, span: 0.65, v: 0 },
    { el: document.getElementById('w2'), rise: 0.22, fall: 0.07, wob: 0.18, hz: 5.5, base: 0.3, span: 0.55, v: 0 },
    { el: document.getElementById('w3'), rise: 0.12, fall: 0.2, wob: 0.14, hz: 3.1, base: 0.25, span: 0.45, v: 0 },
  ];
  const words = document.getElementById('words');
  listen('words', e => { words.textContent = e.payload; });
  function frame(t) {
    shown += (target - shown) * (target > shown ? 0.5 : 0.12);
    pill.style.setProperty('--lvl', shown.toFixed(3));
    for (const [i, r] of rings.entries()) {
      r.v += (target - r.v) * (target > r.v ? r.rise : r.fall);
      const wob = r.wob * r.v * Math.sin(t / 1000 * r.hz * 2 * Math.PI + i * 2);
      r.el.style.setProperty('--l', r.v.toFixed(3));
      r.el.style.setProperty('--s', Math.max(0.2, r.base + r.v * r.span + wob).toFixed(3));
    }
    if (on) requestAnimationFrame(frame);
  }
</script>
</body>
</html>
